<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Desenvolvedor</title>
    <style>
        body{
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;}
        .painel{
            background: #fff;
            padding:20px;
            border-radius: 8px;
            width: 300px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input{
            padding: 8px;
            width: 90%;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button{
            padding: 10px;
            background:#0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width:100%;
            font-weight: bold;
        }

        /* estilo q vai ser alterado pelo js*/
        .cartao{
            background: #fff;
            color: #333;
            padding: 15px;
            border-radius: 8px;
            width: 300px;
            border-left: 10px solid #0056b3;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .cartao h3{
            margin: 0 0 10px 0;
            color: #0056b3;
        }
        .cartao p{
            margin: 5px 0;
        }
        .destaque{
            font-weight: bold;
            color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- PAINEL DE DIGITAÇÂO -->
    <div class="painel">
        <h2>Cadastro de Perfil</h2>
        <label>Nome do aluno/Dev: </label>
        <input type="text" id="input-nome" placeholder="Ex: Célide...">

        <label>Linguagem favorita: </label>
        <input type="text" id="input-linguagem" placeholder="Ex: PHP, javascript...">

        <button id="btn-registrar">Criar Perfil</button>
    </div>
    
    <!-- O CARTÂO (que começa vazio) -->
    <div class="cartao">
        <h3>PERFIL DO DESENVOLVEDOR</h3>
        <p>nome: <span id="cartao-nome" class="destaque">???</span></p>
        <p>Linhguagem: <span id="cartao-linguagem" class="destaque">???</span></p>
    </div>
    <script>
        //get botão de registrar
        let botao = document.getElementById("btn-registrar");
        //get inputs do usuario
        let campoNome = document.getElementById("input-nome");
        let campoLinguagem = document.getElementById("input-linguagem");
        //get paragrafos de texto
        let spanNome = document.getElementById("cartao-nome");
        let spanLinguagem = document.getElementById("cartao-linguagem");

        //clique do botão
        botao.addEventListener("click",function(){
            //pega o valor digitado pelo usuario no input
            let nomeDigitado = campoNome.value;
            let linguagemDigitada = campoLinguagem.value;
            //substituição de valores nos paragrafos de texto pelos valores digitados
            spanNome.innerText = nomeDigitado;
            spanLinguagem.innerText = linguagemDigitada;
            //limpar os campos depois do registro
            campoNome.value="";
            campoLinguagem.value="";
        });
    </script>
</body>
</html>
